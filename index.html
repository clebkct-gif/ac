<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Bloqueio contra alteração de cores do sistema e Modo Escuro -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>Oratório & Biblioteca</title>

    <link rel="manifest" href="manifest.json">

    <style>
        /* ==========================================================================
           RESET & PROTEÇÃO DE CORES
           ========================================================================== */
        :root {
            color-scheme: light !important;
            supported-color-schemes: light !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            forced-color-adjust: none !important;
            -webkit-forced-color-adjust: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            overflow: hidden;
            background-color: #000000;
        }

        /* ==========================================================================
           IMAGENS COM TRATAMENTO DE BRILHO E FIDELIDADE
           ========================================================================== */
        .app-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
            mix-blend-mode: normal !important;
            
            /* Ajuste de brilho para neutralizar o tom escuro do navegador */
            filter: brightness(1.20) contrast(1.05) saturate(1.05) !important;
            -webkit-filter: brightness(1.20) contrast(1.05) saturate(1.05) !important;
            image-rendering: auto;
        }

        /* ==========================================================================
           TELA SPLASH / INICIAL
           ========================================================================== */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background-color: #000000;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ==========================================================================
           ESTANTE E HOTSPOTS DE PRECISÃO ABSOLUTA
           ========================================================================== */
        #bookshelf {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #000000;
        }

        .hotspot-book {
            position: absolute;
            border-radius: 6px;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.15s ease, background-color 0.15s ease;
            border: 1.5px solid transparent;
        }

        /* Animação tátil e efeito luminoso ao tocar no livro */
        .hotspot-book:active {
            transform: scale(1.04);
            background-color: rgba(255, 215, 0, 0.25);
            border-color: rgba(255, 235, 170, 0.8);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.7);
        }

        /* --- COORDENADAS COLETADAS INDIVIDUALMENTE --- */
        /* 1. Missal */
        #book-missal { top: 43.10%; left: 2.80%; width: 28.00%; height: 16.60%; }

        /* 2. Lecionário */
        #book-lecionario { top: 43.50%; left: 36.40%; width: 27.20%; height: 16.40%; }

        /* 3. Liturgias */
        #book-liturgias { top: 42.90%; left: 68.80%; width: 29.80%; height: 17.00%; }

        /* 4. Orações, Santos e Novenas */
        #book-oracoes { top: 62.10%; left: 3.20%; width: 27.40%; height: 16.60%; }

        /* 5. Bíblia */
        #book-biblia { top: 62.10%; left: 35.60%; width: 28.40%; height: 16.60%; }

        /* 6. Servidores do Altar */
        #book-servidores { top: 62.10%; left: 69.00%; width: 29.80%; height: 16.60%; }

        /* 7. Músicos */
        #book-musicos { top: 81.10%; left: 2.00%; width: 29.00%; height: 16.80%; }

        /* 8. Jogos e Atividades */
        #book-jogos { top: 80.90%; left: 36.40%; width: 27.80%; height: 16.60%; }

        /* 9. ShopSaint */
        #book-shopsaint { top: 81.10%; left: 68.80%; width: 29.80%; height: 16.00%; }

        /* ==========================================================================
           CONTÊINER DO LIVRO EXPANDIDO / IFRAME
           ========================================================================== */
        #book-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #book-stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        .book-content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            transform: scale(0.85);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        #book-stage.open .book-content-wrapper {
            transform: scale(1);
            opacity: 1;
        }

        iframe#book-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        .fab-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(30, 20, 12, 0.92);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #d4af37;
            font-size: 22px;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.4s ease 0.2s, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s;
            pointer-events: none;
        }

        #book-stage.open .fab-close {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .fab-close:active {
            transform: scale(0.9) !important;
            background: rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Tela Inicial -->
        <div id="splash-screen" aria-label="Toque para Iniciar">
            <img src="iniciar.png" alt="Tela Inicial" class="app-bg-image">
        </div>

        <!-- Estante de Livros Interativa -->
        <div id="bookshelf">
            <img src="520821.png" alt="Estante de Livros" class="app-bg-image">
            
            <!-- Hotspots com Posicionamento Absoluto Calibrado -->
            <div id="book-missal" class="hotspot-book" data-path="missal/index.html" data-title="Missal"></div>
            <div id="book-lecionario" class="hotspot-book" data-path="lecionario/index.html" data-title="Lecionário"></div>
            <div id="book-liturgias" class="hotspot-book" data-path="liturgias/index.html" data-title="Liturgias"></div>

            <div id="book-oracoes" class="hotspot-book" data-path="oracoes/index.html" data-title="Orações"></div>
            <div id="book-biblia" class="hotspot-book" data-path="biblia/index.html" data-title="Bíblia"></div>
            <div id="book-servidores" class="hotspot-book" data-path="servidores/index.html" data-title="Servidores do Altar"></div>

            <div id="book-musicos" class="hotspot-book" data-path="musicos/index.html" data-title="Músicos"></div>
            <div id="book-jogos" class="hotspot-book" data-path="jogos/index.html" data-title="Jogos e Atividades"></div>
            <div id="book-shopsaint" class="hotspot-book" data-path="shopsaint/index.html" data-title="ShopSaint"></div>
        </div>

        <!-- Exibição do Livro Aberto -->
        <div id="book-stage">
            <button class="fab-close" id="btn-close" aria-label="Fechar livro">✕</button>
            <div class="book-content-wrapper">
                <iframe id="book-iframe" src="about:blank"></iframe>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splash-screen');
            const bookStage = document.getElementById('book-stage');
            const bookIframe = document.getElementById('book-iframe');
            const btnClose = document.getElementById('btn-close');
            const hotspots = document.querySelectorAll('.hotspot-book');

            let audioCtx = null;
            let soundOpenBuffer = null;
            let soundCloseBuffer = null;

            function initAudio() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                    loadSound('open-book.mp3', buf => soundOpenBuffer = buf);
                    loadSound('close-book.mp3', buf => soundCloseBuffer = buf);
                }
            }

            function loadSound(url, callback) {
                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error("Som não encontrado");
                        return response.arrayBuffer();
                    })
                    .then(data => audioCtx.decodeAudioData(data))
                    .then(buffer => callback(buffer))
                    .catch(() => {});
            }

            function playSound(buffer, fallbackFreq = 220) {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                if (buffer) {
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                } else {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(fallbackFreq, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                }
            }

            function triggerVibration(pattern) {
                if ('vibrate' in navigator) {
                    try { navigator.vibrate(pattern); } catch (e) {}
                }
            }

            function requestFullscreen() {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen().catch(() => {});
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                }
            }

            function handleStart() {
                initAudio();
                requestFullscreen();
                triggerVibration(20);
                splashScreen.classList.add('hidden');
            }

            splashScreen.addEventListener('click', handleStart);

            hotspots.forEach(hotspot => {
                hotspot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const pagePath = hotspot.getAttribute('data-path');
                    
                    triggerVibration(25);
                    playSound(soundOpenBuffer, 320);

                    bookIframe.src = pagePath;
                    bookStage.classList.add('active');
                    requestAnimationFrame(() => {
                        bookStage.classList.add('open');
                    });
                });
            });

            function closeBook() {
                triggerVibration([10, 20, 10]);
                playSound(soundCloseBuffer, 180);

                bookStage.classList.remove('open');
                setTimeout(() => {
                    bookStage.classList.remove('active');
                    bookIframe.src = 'about:blank';
                }, 450);
            }

            btnClose.addEventListener('click', closeBook);

            window.addEventListener('message', (event) => {
                if (event.data === 'close-book') {
                    closeBook();
                }
            });

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        });
    </script>
</body>
</html>
